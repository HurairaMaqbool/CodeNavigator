apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: codebase-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--requirepass", "$(REDIS_PASSWORD)"]
          envFrom:
            - secretRef:
                name: agent-secrets
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: codebase-agent
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
